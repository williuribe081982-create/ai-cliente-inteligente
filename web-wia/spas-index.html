<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIERRA for Spas · WIA</title>
<meta name="description" content="Your AI assistant on WhatsApp that answers, books and confirms spa appointments 24/7.">
<meta property="og:title" content="SIERRA for Spas — Book clients 24/7 on WhatsApp">
<meta property="og:description" content="Your AI assistant answers, books and confirms appointments — even while your spa is closed.">
<meta property="og:image" content="https://cdn.jsdelivr.net/gh/williuribe081982-create/ai-cliente-inteligente@5571c47/media/video/poster-en.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Michroma&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1020;--navy:#0e1530;--card:#141c3a;--line:#25305a;--txt:#e9ecf7;--mut:#a7b0cf;--blue:#22a6ff;--blue2:#5fb3ff;--lav:#b79be6;--lav2:#efe6ff;--gold:#d9ad6c}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--txt);font-family:Montserrat,system-ui,sans-serif;font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:20;background:rgba(11,16,32,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:Michroma,sans-serif;letter-spacing:1px}
.brand img{height:34px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--mut);letter-spacing:2px}
.lang{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:3px}
.lang button{border:0;background:none;color:var(--mut);font:600 13px Montserrat;padding:6px 12px;border-radius:30px;cursor:pointer}
.lang button.on{background:var(--blue);color:#fff}
.hero{padding:64px 0 40px;background:radial-gradient(80% 60% at 85% 10%,rgba(183,155,230,.22),transparent 60%),radial-gradient(60% 50% at 10% 0%,rgba(34,166,255,.18),transparent 60%)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.kicker{display:inline-block;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);border:1px solid rgba(217,173,108,.4);padding:6px 12px;border-radius:30px}
h1{font-family:Michroma,sans-serif;font-weight:400;font-size:clamp(28px,4.2vw,44px);line-height:1.18;margin:18px 0 16px;letter-spacing:0}
h1 em{font-style:normal;color:var(--lav)}
.lead{font-size:18px;font-weight:300;color:var(--mut);max-width:540px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:12px;font-weight:700;text-decoration:none;font-size:15px}
.btn.p{background:var(--blue);color:#fff;box-shadow:0 10px 30px rgba(34,166,255,.3)}
.btn.s{border:1px solid var(--line);background:var(--card)}
.trust{display:flex;gap:22px;margin-top:28px;color:var(--mut);font-size:14px;flex-wrap:wrap}
.trust b{color:var(--txt);display:block;font-size:22px}
.video{position:relative;border-radius:28px;overflow:hidden;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 1px var(--line);max-width:380px;margin-left:auto;aspect-ratio:9/16}
.video video{width:100%;height:100%;display:block;object-fit:cover}
section{padding:72px 0}
.alt{background:var(--navy);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
h2{font-family:Michroma,sans-serif;font-weight:400;font-size:clamp(22px,3vw,32px);line-height:1.25;margin-bottom:14px}
.sub{color:var(--mut);max-width:640px;font-size:17px}
.grid{display:grid;gap:18px;margin-top:36px}
.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.card .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(183,155,230,.14);margin-bottom:14px}
.card h3{font-size:17px;margin-bottom:6px}
.card p{color:var(--mut);font-size:15px}
.pain .card{border-left:3px solid var(--gold)}
.steps{counter-reset:s}
.steps .card{position:relative;padding-top:56px}
.steps .card:before{counter-increment:s;content:"0" counter(s);position:absolute;top:20px;left:24px;font:700 13px Michroma;letter-spacing:2px;color:var(--gold)}
.price{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:36px}
.pbox{background:linear-gradient(160deg,#1a2350,#121a3a);border:1px solid #33407a;border-radius:22px;padding:32px}
.pbox .tag{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
.old{color:var(--mut);text-decoration:line-through;font-size:20px;margin-top:14px}
.big{font-size:52px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.big small{font-size:16px;font-weight:500;color:var(--mut)}
.pbox ul{list-style:none;margin-top:20px;display:grid;gap:10px}
.pbox li{padding-left:28px;position:relative;color:#d6dcf3}
.pbox li:before{content:"✓";position:absolute;left:0;color:var(--blue);font-weight:800}
.trial{background:var(--card);border:1px dashed var(--lav);border-radius:22px;padding:28px}
.trial .big{font-size:44px;color:var(--lav)}
.note{color:var(--mut);font-size:13px;margin-top:14px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:10px}
.faq summary{font-weight:600;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";float:right;color:var(--blue);font-weight:700}
.faq details[open] summary:after{content:"–"}
.faq p{color:var(--mut);margin-top:10px}
.founder{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.founder .av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--lav));display:flex;align-items:center;justify-content:center;font:400 28px Michroma}
.final{text-align:center;padding:84px 0;background:radial-gradient(60% 80% at 50% 0%,rgba(34,166,255,.2),transparent 70%)}
.final .ctas{justify-content:center}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--mut);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.demo-tag{display:inline-block;margin-top:10px;font-size:12px;color:var(--mut)}
@media(max-width:860px){.hero .wrap,.price,.founder{grid-template-columns:1fr}.video{margin:0 auto}.g3,.g4,.g2{grid-template-columns:1fr}section{padding:56px 0}.hero{padding-top:40px}}
</style></head>
