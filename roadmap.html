<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roadmap interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050814;--panel:#0b1226cc;--panel2:#0e1731;--line:#223055;--txt:#eaf0ff;--mut:#8e9bbb;--gold:#c9a36a;--gold2:#e6c893;--c1:#22d3ee;--c2:#3b82f6;--c3:#a855f7;--c4:#2dd4bf;--c5:#f59e0b;--c6:#ec4899;--c7:#84cc16;--c8:#f97316}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--txt);font-family:Montserrat,Arial,sans-serif;line-height:1.5;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 600px at 80% -10%,#3b1d7a55,transparent 60%),radial-gradient(800px 500px at 10% 110%,#0e749044,transparent 60%),linear-gradient(#050814,#070b1d)}
body:after{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:44px 44px}
a{color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:#060a18cc;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:18px}
.clogo{min-height:54px;display:flex;align-items:center;gap:10px}
.clogo .ph{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--c1),var(--c3));display:grid;place-items:center;font-weight:800;font-size:18px;color:#050814}
.clogo b{display:block;font-size:15px;letter-spacing:.04em}.clogo small{color:var(--mut);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;text-decoration:none;padding:10px 12px;border-radius:10px;color:#c8d2ea;font-size:14px;border:1px solid transparent}
.nav a:hover,.nav a.on{background:#0f1a38;border-color:#26407a;color:#fff;box-shadow:0 0 0 1px #22d3ee22,0 0 18px #22d3ee22}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.side .motto{margin-top:auto;font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:#aab6d6;border-top:2px solid var(--c1);padding-top:12px;width:fit-content}
/* main */
main{padding:22px 26px 40px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.topbar nav{display:flex;gap:4px;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:#0a1226aa}
.topbar nav a{font-size:13px;text-decoration:none;padding:6px 12px;border-radius:999px;color:#c8d2ea}.topbar nav a:hover{background:#15204a}
.wh{display:flex;align-items:center;gap:14px}.wh img{height:34px}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:11px 20px;font-weight:600;font-size:14px;text-decoration:none;cursor:pointer;border:1px solid #3b82f680;background:#0b1430;color:#fff;transition:.2s}
.btn:hover{box-shadow:0 0 22px #3b82f666;transform:translateY(-1px)}
.btn.pri{border:0;background:linear-gradient(90deg,#2563eb,#22d3ee);box-shadow:0 0 24px #22d3ee55}
.btn.gold{border:0;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1a1408}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr 1fr 290px;gap:18px;margin-top:22px;align-items:stretch}
.hero .t .k{font-size:13px;letter-spacing:.35em;color:var(--c1);font-weight:600;text-transform:uppercase}
.hero h1{font-weight:800;font-size:clamp(40px,5.4vw,78px);line-height:.95;margin:10px 0 16px;letter-spacing:-.01em}
.hero h1 span{display:block;background:linear-gradient(90deg,#22d3ee,#3b82f6 60%,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:17px;color:#cfd8ef;max-width:560px;margin:0 0 22px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap}
.play{width:34px;height:34px;border-radius:50%;border:2px solid #22d3ee;display:grid;place-items:center}.play:after{content:"";border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.path{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(500px 300px at 70% 20%,#4c1d9566,transparent 70%),radial-gradient(400px 300px at 20% 90%,#0e749055,transparent 70%),#070d22;min-height:320px}
.path svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;background:none;border:0;color:#fff;font-family:inherit}
.pin i{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);box-shadow:0 0 14px var(--c),0 0 30px var(--c);border:3px solid #fff}
.pin span{margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 6px #000;white-space:nowrap}
.pin b{font-family:Michroma,sans-serif;font-size:15px;color:var(--c)}
.pin.on i{animation:pulse 1.6s infinite}
.pin span{opacity:0;transition:.2s;background:#050814cc;border:1px solid var(--c);padding:3px 8px;border-radius:8px}.pin.on span,.pin:hover span{opacity:1}.pin:hover{z-index:3}.pin.on{z-index:2}
.pin.up b,.pin.up span{position:absolute;bottom:100%;margin-bottom:6px}.pin.up b{margin-bottom:22px}.pin.up span{margin-top:0}
@keyframes pulse{0%,100%{box-shadow:0 0 10px var(--c),0 0 0 0 var(--c)}50%{box-shadow:0 0 18px var(--c),0 0 0 10px transparent}}
.stats{border:1px solid #6d28d966;border-radius:20px;background:var(--panel);padding:8px 16px;box-shadow:inset 0 0 40px #6d28d922}
.stat{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.stat:last-child{border:0}
.stat .ic{width:44px;height:44px;border-radius:50%;border:1px solid #6d7bb3;display:grid;place-items:center;flex:none}.stat .ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.6}
.stat b{font-size:22px;font-weight:700;display:block;line-height:1.1}.stat small{color:#c1cae3;font-size:12px}
/* phase tabs */
.tabs{display:grid;grid-template-columns:repeat(var(--n),minmax(150px,1fr));gap:10px;margin:22px 0 16px;overflow-x:auto;padding-bottom:4px}
.tab{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#0a1127;color:#dbe3f7;cursor:pointer;text-align:left;font-family:inherit;transition:.2s;min-width:150px}
.tab .i{width:40px;height:40px;border-radius:10px;border:1px solid var(--c);display:grid;place-items:center;color:var(--c);flex:none;font-family:Michroma,sans-serif;font-size:15px}.tab .i em{font-style:normal}
.tab b{font-family:Michroma,sans-serif;font-size:18px;color:var(--c)}.tab span{font-size:13px;line-height:1.25}
.tab:hover{border-color:var(--c)}.tab.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 24px color-mix(in srgb,var(--c) 45%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,#0a1127),#0a1127)}
.tab.done .i:after{content:"✓";font-family:Montserrat;font-size:16px}.tab.done .i{background:color-mix(in srgb,var(--c) 25%,transparent)}.tab.done .i em{display:none}
/* detail grid */
.grid{display:grid;grid-template-columns:1.05fr 1.2fr .95fr;gap:16px}
.card{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:20px;position:relative;overflow:hidden}
.card h3{margin:0 0 12px;font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:#c8d2ea;font-weight:600}
.phase{min-height:280px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(90deg,#070d22 30%,transparent),var(--ph,none) center/cover,#070d22}
.phase .k{font-size:12px;letter-spacing:.35em;color:var(--c);font-weight:600}
.phase h2{font-size:32px;font-weight:800;line-height:1.05;margin:8px 0 10px;text-transform:uppercase;max-width:340px}
.phase h2:after{content:"";display:block;width:52px;height:3px;background:var(--c);margin-top:14px;box-shadow:0 0 10px var(--c)}
.phase p{margin:0;color:#dbe3f7;max-width:340px}
.phase .dur{margin-top:14px;font-size:12px;color:var(--mut);letter-spacing:.15em;text-transform:uppercase}
.phase .art{position:absolute;right:-20px;top:20px;width:55%;opacity:.9}
.sub{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sub button{font-family:inherit;font-size:13px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#0a1127;color:#dbe3f7;cursor:pointer}
.sub button.on{border-color:var(--c2);background:#12224d;box-shadow:0 0 14px #3b82f655}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #ffffff12;font-size:14.5px}
.list li:before{content:"✓";flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--c1);color:var(--c1);display:grid;place-items:center;font-size:12px;font-weight:700}
.empty{color:var(--mut);font-size:14px;font-style:italic}
.video{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:linear-gradient(135deg,#0f1e4a,#2a0f4a);border:1px dashed #3b4f86;display:grid;place-items:center;text-align:center}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .pl{width:58px;height:58px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;margin:0 auto 8px;box-shadow:0 0 22px #a855f7}.video .pl:after{content:"";border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:5px}
.video small{color:#c1cae3;font-size:12px}
.mocks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mock{aspect-ratio:4/3;border-radius:10px;border:1px solid #2b3d6e;overflow:hidden;background:#0b1430;cursor:pointer;position:relative}
.mock img{width:100%;height:100%;object-fit:cover}.mock svg{width:100%;height:100%}
.mock:hover{border-color:var(--c1);box-shadow:0 0 14px #22d3ee55}
/* bottom */
.row2{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:16px;margin-top:16px}
.ov{position:relative;height:150px}.ov svg{position:absolute;inset:0;width:100%;height:100%}
.ovp{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;background:none;border:0;color:#fff;font-family:inherit}
.ovp i{display:block;width:18px;height:18px;border-radius:50%;margin:0 auto 6px;border:3px solid var(--c);background:#050814;box-shadow:0 0 12px var(--c)}
.ovp.on i{background:var(--c)}.ovp b{font-family:Michroma,sans-serif;font-size:13px;color:var(--c)}.ovp span{display:block;font-size:11px;color:#dbe3f7;max-width:90px}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:#0a1127;font-size:12.5px;color:#dbe3f7}
.metric svg{width:26px;height:26px;stroke:var(--c1);fill:none;stroke-width:1.6;display:block;margin:0 auto 6px}
.docs a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;text-decoration:none;font-size:13.5px;background:#0a1127}
.docs a:hover{border-color:var(--c1)}.docs svg{width:18px;height:18px;stroke:var(--c1);fill:none;stroke-width:1.8;flex:none}
.foot{margin-top:16px;border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:16px 20px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.foot .hf{display:flex;gap:12px;align-items:center;padding-right:18px;border-right:1px solid var(--line)}
.foot .hf b{color:var(--c1);letter-spacing:.2em;font-size:13px}.foot .hf small{display:block;color:#dbe3f7;font-size:13px}
.foot .it{display:flex;align-items:center;gap:10px;font-size:13px;color:#dbe3f7}.foot svg{width:28px;height:28px;stroke:var(--c1);fill:none;stroke-width:1.5;flex:none}
.foot .btn{margin-left:auto}
.inv{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:16px;border:1px solid #3a3222;border-radius:18px;padding:20px 24px;background:linear-gradient(135deg,#141026,#0a1127)}
.inv .v{font-family:Michroma,sans-serif;font-size:32px;color:var(--gold2)}.inv small{color:var(--mut)}
.lb{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:9;padding:20px}.lb.on{display:grid}.lb > div{max-width:960px;width:100%}.lb img,.lb svg{width:100%;border-radius:14px;border:1px solid #334}
.lb p{text-align:center;color:#dbe3f7}
@media(max-width:1180px){.hero{grid-template-columns:1fr 1fr}.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:0}.grid{grid-template-columns:1fr 1fr}.grid .media{grid-column:1/-1}.row2{grid-template-columns:1fr 1fr}.row2 .ovc{grid-column:1/-1}}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{display:none}.hero,.grid,.row2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.topbar nav{display:none}main{padding:16px}.tabs{grid-template-columns:repeat(var(--n),160px)}.foot .hf{border:0}.foot .btn{margin-left:0}}
@media print{.side,.topbar nav,.btn{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="clogo" id="clientLogo"></div>
  <nav class="nav" id="sideNav"></nav>
  <div class="motto" id="motto"></div>
</aside>
<main>
  <div class="topbar">
    <nav><a href="#roadmap">Visión</a><a href="#detalle">Solución</a><a href="#vista">Implementación</a><a href="#metricas">Impacto</a><a href="#media">Galería</a><a href="#contacto">Contacto</a></nav>
    <div class="wh"><img id="whLogo" alt="WH IA"><a class="btn" id="execBtn" href="#inversion">Propuesta ejecutiva →</a></div>
  </div>

  <section class="hero" id="roadmap">
    <div class="t">
      <div class="k" id="heroK"></div>
      <h1>Roadmap <span>interactivo</span></h1>
      <p id="heroP"></p>
      <div class="acts"><a class="btn" id="heroVideo" href="#media"><span class="play"></span>Ver video del roadmap</a><button class="btn pri" onclick="window.print()">Descargar roadmap PDF ⤓</button></div>
    </div>
    <div class="path" id="path"></div>
    <div class="stats" id="stats"></div>
  </section>

  <div class="tabs" id="tabs"></div>

  <section class="grid" id="detalle">
    <div class="card phase" id="phaseCard"></div>
    <div class="card"><div class="sub" id="sub"></div><ul class="list" id="subList"></ul></div>
    <div class="card media" id="media"><h3 id="vidT"></h3><div class="video" id="video"></div><h3 style="margin-top:16px" id="mockT"></h3><div class="mocks" id="mocks"></div></div>
  </section>

  <section class="row2">
    <div class="card ovc" id="vista"><h3>Vista general del roadmap</h3><div class="ov" id="ov"></div></div>
    <div class="card" id="metricas"><h3>Métricas esperadas</h3><div class="metrics" id="metrics"></div></div>
    <div class="card"><h3>Documentos de la fase</h3><div class="docs" id="docs"></div></div>
  </section>

  <section class="inv" id="inversion"></section>

  <section class="foot" id="contacto"></section>
</main>
</div>
<div class="lb" id="lb" onclick="this.classList.remove('on')"><div id="lbc"></div></div>

<script>
/* ======= DATOS DEL CLIENTE (esto es lo único que cambia entre clientes) ======= */
const DATA = /*DATA*/{
  consultant:{name:"William Hernández",title:"AI Business Architect",logo:"https://ai-cliente-inteligente.onrender.com/brand/logo.png",whatsapp:"573004699312",email:"arqwilliamhernandez@gmail.com",phone:"300 469 9312"},

/* ======= RENDER ======= */
const COLORS=["--c1","--c2","--c3","--c4","--c5","--c6","--c7","--c8"];
const col=i=>`var(${COLORS[i%COLORS.length]})`;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICON={map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/>',alert:'<path d="M12 3 2 21h20L12 3zM12 10v5M12 18v.5"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',star:'<path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9L12 3z"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M17 11a3 3 0 1 0 0-6M21 20c0-2.5-1.5-4-4-4.6"/>',doc:'<path d="M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h7"/>',home:'<path d="M3 11 12 4l9 7v9H5v-9"/>',road:'<path d="M4 20 9 4M20 20 15 4M12 6v2M12 11v2M12 16v2"/>',img:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-8 7"/>',play:'<circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',money:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',down:'<path d="M12 4v12M6 11l6 6 6-6M4 20h16"/>'};
const svg=k=>`<svg viewBox="0 0 24 24">${ICON[k]||ICON.star}</svg>`;
const D=DATA, P=D.phases, N=P.length;
let cur=0, subk="objetivos";

/* mockup de pantalla generado (se reemplaza por imagen real cuando exista) */
function mockSVG(i,label){const c=getComputedStyle(document.documentElement).getPropertyValue(COLORS[i%8]).trim()||"#22d3ee";
 const bars=[40,65,50,80,58,90].map((h,j)=>`<rect x="${22+j*14}" y="${92-h*0.6}" width="8" height="${h*0.6}" rx="2" fill="${c}" opacity="${.45+j*.09}"/>`).join("");
 return `<svg viewBox="0 0 160 120"><rect width="160" height="120" fill="#0a1233"/><rect x="0" y="0" width="160" height="12" fill="#101c46"/><circle cx="7" cy="6" r="2" fill="#f87171"/><circle cx="14" cy="6" r="2" fill="#fbbf24"/><circle cx="21" cy="6" r="2" fill="#34d399"/><rect x="8" y="18" width="10" height="94" rx="2" fill="#13214f"/>${bars}<path d="M108 80 L118 62 L128 70 L138 44 L150 52" stroke="${c}" stroke-width="2" fill="none"/><rect x="104" y="18" width="48" height="14" rx="3" fill="#13214f"/><rect x="104" y="92" width="48" height="20" rx="3" fill="#13214f"/><text x="80" y="116" fill="#8e9bbb" font-size="7" text-anchor="middle" font-family="Montserrat,Arial">${esc(label||"Mockup")}</text></svg>`}

function renderStatic(){
 document.documentElement.style.setProperty("--n",N);
 const c=D.client;
 $("clientLogo").innerHTML=c.logo?`<img src="${esc(c.logo)}" alt="${esc(c.name)}" style="max-height:54px;max-width:190px">`:`<div class="ph">${esc(c.short||c.name[0])}</div><div><b>${esc(c.name)}</b><small>${esc(c.tagline||"")}</small></div>`;
 $("sideNav").innerHTML=[["home","Inicio","#roadmap"],["road","Roadmap","#detalle"],...P.slice(0,5).map((p,i)=>["star",p.name,"#detalle",i]),["chart","Impacto","#metricas"],["img","Mockups y demos","#media"],["money","Inversión","#inversion"],["mail","Contacto","#contacto"]]
   .map(([ic,t,h,i])=>`<a href="${h}" ${i!==undefined?`data-i="${i}"`:""} class="${t==="Inicio"?"on":""}">${svg(ic)}${esc(t)}</a>`).join("");
 $("sideNav").querySelectorAll("a[data-i]").forEach(a=>a.onclick=()=>go(+a.dataset.i));
 $("motto").textContent=c.motto||"";
 $("whLogo").src=D.consultant.logo;
 $("heroK").textContent=c.name+" · "+D.service;
 $("heroP").textContent=D.intro;
 /* camino con pines */
 const pts=P.map((_,i)=>{const t=i/(N-1);return[10+t*80,84-t*62+(i%2?-6:6)]});
 const d=pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");
 $("path").innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><path d="${d}" stroke="url(#g)" stroke-width=".9" fill="none" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 4px #a855f7)"/></svg>`+
   P.map((p,i)=>`<button class="pin${i%2?" up":""}" data-i="${i}" style="left:${pts[i][0]}%;top:${pts[i][1]}%;--c:${col(i)}"><i></i><b>${String(i+1).padStart(2,"0")}</b><span>${esc(p.name)}</span></button>`).join("");
 $("path").querySelectorAll(".pin").forEach(b=>b.onclick=()=>go(+b.dataset.i));
 $("stats").innerHTML=D.stats.map(s=>`<div class="stat"><div class="ic">${svg(s.ic)}</div><div><b>${esc(s.v)}</b><small>${esc(s.l)}</small></div></div>`).join("");
 $("tabs").innerHTML=P.map((p,i)=>`<button class="tab" data-i="${i}" style="--c:${col(i)}"><div class="i"><em>${String(i+1).padStart(2,"0")}</em></div><span>${esc(p.name)}</span></button>`).join("");
 $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(+b.dataset.i));
 /* vista general */
 const op=P.map((_,i)=>[6+i*(88/(N-1)),70-i*(40/(N-1))]);
 $("ov").innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${op.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ")}" stroke="url(#g)" stroke-width="1" fill="none" vector-effect="non-scaling-stroke"/></svg>`+
   P.map((p,i)=>`<button class="ovp" data-i="${i}" style="left:${op[i][0]}%;top:${op[i][1]}%;--c:${col(i)}"><i></i><b>${String(i+1).padStart(2,"0")}</b><span>${esc(p.name)}</span></button>`).join("");
 $("ov").querySelectorAll(".ovp").forEach(b=>b.onclick=()=>go(+b.dataset.i));
 $("metrics").innerHTML=D.metrics.map(m=>`<div class="metric">${svg(m.ic)}${esc(m.l)}</div>`).join("");
 const wa=`https://wa.me/${D.consultant.whatsapp}?text=${encodeURIComponent("Hola William, revisé el roadmap de "+D.service)}`;
 $("inversion").innerHTML=`<div><div style="font-size:12px;letter-spacing:.35em;color:var(--gold);text-transform:uppercase">Inversión</div><div class="v">${esc(D.investment.display)} <small>${esc(D.investment.currency)}</small></div><small>${esc(D.investment.note||"")}</small></div><a class="btn gold" href="${wa}">Agendar reunión por WhatsApp</a>`;
 $("contacto").innerHTML=`<div class="hf">${svg("users")}<div><b>HUMAN FIRST</b><small>La tecnología potencia. Las personas deciden.</small></div></div>`+
   D.pillars.map((t,i)=>`<div class="it">${svg(["doc","map","clock","chart"][i%4])}${esc(t)}</div>`).join("")+`<button class="btn pri" id="next">Avanzar a la siguiente fase →</button>`;
 $("next").onclick=()=>go((cur+1)%N,true);
}
function renderPhase(){
 const p=P[cur], c=col(cur);
 document.querySelectorAll(".tab").forEach((t,i)=>{t.classList.toggle("on",i===cur);t.classList.toggle("done",i<cur)});
 document.querySelectorAll(".pin,.ovp").forEach(t=>t.classList.toggle("on",+t.dataset.i===cur));
 $("phaseCard").style.setProperty("--c",c);
 $("phaseCard").style.setProperty("--ph",p.image?`url("${p.image}")`:"none");
 $("phaseCard").innerHTML=`${p.image?"":`<div class="art">${mockSVG(cur,"")}</div>`}<div style="position:relative"><div class="k">FASE ${String(cur+1).padStart(2,"0")}</div><h2>${esc(p.short||p.name)}</h2><p>${esc(p.desc)}</p>${p.duration?`<div class="dur">Duración: ${esc(p.duration)}</div>`:""}</div>`;
 const tabsSub=[["objetivos","Objetivos"],["entregables","Entregables"],["criterio","Criterio de avance"],["humano","Enfoque humano"]];
 $("sub").innerHTML=tabsSub.map(([k,t])=>`<button data-k="${k}" class="${k===subk?"on":""}">${t}</button>`).join("");
 $("sub").querySelectorAll("button").forEach(b=>b.onclick=()=>{subk=b.dataset.k;renderPhase()});
 const items=p[subk]||[];
 $("subList").innerHTML=items.length?items.map(x=>`<li>${esc(x)}</li>`).join(""):`<li class="empty" style="border:0">Se define con el cliente en esta fase.</li>`;
 $("vidT").textContent="Video de la fase "+String(cur+1).padStart(2,"0");
 const v=p.video||(cur===0?D.video.url:null);
 $("video").innerHTML=v?(/youtu|vimeo|loom/.test(v)?`<iframe src="${esc(v)}" allowfullscreen></iframe>`:`<video src="${esc(v)}" controls></video>`)
   :`<div><div class="pl"></div><small>Espacio para el video de esta fase</small></div>`;
 $("mockT").textContent="Mockups de la fase "+String(cur+1).padStart(2,"0");
 const m=p.mockups&&p.mockups.length?p.mockups:[{title:"Pantalla 1"},{title:"Pantalla 2"},{title:"Pantalla 3"}];
 $("mocks").innerHTML=m.slice(0,6).map((x,j)=>`<div class="mock" data-j="${j}">${x.img?`<img src="${esc(x.img)}" alt="${esc(x.title)}">`:mockSVG(cur+j,x.title)}</div>`).join("");
 $("mocks").querySelectorAll(".mock").forEach(el=>el.onclick=()=>{$("lbc").innerHTML=el.innerHTML+`<p>${esc(m[+el.dataset.j].title||"")}</p>`;$("lb").classList.add("on")});
 const docs=p.docs&&p.docs.length?p.docs:[{name:"Resumen de la fase "+String(cur+1).padStart(2,"0")+".pdf",url:null},{name:"Checklist de la fase.pdf",url:null}];
 $("docs").innerHTML=docs.map(x=>`<a href="${x.url?esc(x.url):"javascript:void(0)"}" ${x.url?"target=_blank":""}>${svg("doc")}<span style="flex:1">${esc(x.name)}</span>${svg("down")}</a>`).join("");
}
function go(i,scroll){cur=i;renderPhase();if(scroll!==false)document.getElementById("detalle").scrollIntoView({behavior:"smooth",block:"start"})}
renderStatic();cur=0;renderPhase();
</script>
</body>
</html>
