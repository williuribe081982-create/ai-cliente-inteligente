<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>Luna Spa Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--deep:#1c1430;--plum:#4a2c63;--vio:#7b52a0;--lav:#b48cc9;--lav2:#e4d3ef;--mist:#f4eef9;--ink:#251d30;--soft:#6f6679;--r:22px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Jost",system-ui,sans-serif;font-weight:300;color:var(--ink);background:linear-gradient(180deg,#efe4f7 0,#efe4f7 420px,#faf7fc 420px);-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh}
.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img,video{display:block;max-width:100%}

/* top bar */
.bar{position:sticky;top:0;z-index:40;background:rgba(28,20,48,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff}
.bar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.bar .lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#a99bb8;white-space:nowrap}
.svcs{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
.svcs::-webkit-scrollbar{display:none}
.svcs button{white-space:nowrap;padding:8px 14px;border-radius:999px;font-size:13px;color:#cdbfe0;transition:.25s}
.svcs button.on{background:var(--lav);color:var(--deep);font-weight:500}
.lang{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:999px;overflow:hidden;flex:none}
.lang button{padding:6px 12px;font-size:12px;font-weight:500;letter-spacing:1px;color:#cdbfe0}
.lang button.on{background:#fff;color:var(--deep)}

.wrap{max-width:1180px;margin:0 auto;padding:26px 16px 40px}
.eyebrow{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--vio);font-weight:500}

/* header */
.head{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:18px;min-width:0}
.brand img{width:108px;flex:none}
.brand h1{font-size:clamp(28px,4vw,44px);line-height:1.05;color:var(--deep)}
.brand p{color:var(--soft);font-size:15px;max-width:560px;margin-top:6px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{background:#fff;padding:6px 12px;border-radius:999px;font-size:12.5px;color:var(--soft)}
.pill b{color:var(--ink);font-weight:500}
.ring{display:flex;align-items:center;gap:12px;background:#fff;border-radius:999px;padding:8px 18px 8px 8px;box-shadow:0 10px 30px -22px rgba(74,44,99,.7)}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--lav2)}
.ring .fg{stroke:var(--vio);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring b{display:block;font-size:20px;color:var(--deep);font-weight:500;line-height:1}
.ring span{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--soft)}

/* aurora guide */
.aurora{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:linear-gradient(120deg,#2a1b40,#4a2c63 60%,#6b4690);color:#fff;border-radius:var(--r);padding:12px 18px 12px 12px;margin-bottom:18px;position:relative;overflow:hidden}
.aurora:after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(201,160,220,.35),transparent 65%);pointer-events:none}
.av{width:78px;height:78px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#e9dcf2,#b48cc9);position:relative;flex:none;box-shadow:0 0 0 3px rgba(201,160,220,.45)}
.av img{position:absolute;width:150%;left:-25%;top:-8%}
.aurora.talk .av{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(201,160,220,.45)}50%{box-shadow:0 0 0 9px rgba(201,160,220,.18)}}
.au-txt small{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#cdb3dd}
.au-txt b{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600;margin-left:6px}
.au-txt p{font-size:14.5px;color:#eadff3;line-height:1.45;min-height:2.9em}
.au-btns{display:flex;gap:8px;position:relative;z-index:1}
.au-btns button{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500;background:var(--lav);color:var(--deep);transition:.2s;white-space:nowrap}
.au-btns button.ghost{background:rgba(255,255,255,.12);color:#fff}
.au-btns button:hover{transform:translateY(-1px)}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.bars i{width:3px;background:currentColor;border-radius:2px;height:4px}
.aurora.talk .bars i{animation:eq .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s!important}.bars i:nth-child(3){animation-delay:.3s!important}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

7d2f4;--gold2:#c9a0dc;--ok:#7fe0b0}
.aria-wrap{position:relative;z-index:2;width:100%;max-width:400px;margin-left:auto}
.aria-stage{--d:.5;--open:0;--wide:0;--round:0;--brow:0;--blinkL:0;--blinkR:0;--rot:0deg;--tx:0px;--ty:0px;--gx:0px;--gy:0px;--amp:0;position:relative;height:380px}
.halo2{position:absolute;left:50%;top:40%;width:400px;height:400px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(var(--glow),.42),transparent 62%);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.1);opacity:.7}}
.floor{position:absolute;left:50%;bottom:40px;width:320px;height:70px;margin-left:-160px;border-radius:50%;background:radial-gradient(rgba(var(--glow),.45),transparent 70%);filter:blur(6px)}
.aria-rig{position:absolute;left:50%;top:calc(-30px * var(--d));width:600px;height:980px;margin-left:-300px;transform:scale(var(--d));transform-origin:50% 0;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,#000 66%,transparent 78%);mask-image:linear-gradient(180deg,#000 66%,transparent 78%)}
.bust{position:absolute;inset:0;background-size:600px 980px;transform-origin:300px 600px;transform:translate(var(--tx),var(--ty)) rotate(var(--rot));filter:drop-shadow(0 0 30px rgba(var(--glow),.35))}
.bust>span{position:absolute;background-size:600px 980px;background-repeat:no-repeat}
.bust .eye-g{width:58px;height:30px;margin:-15px 0 0 -29px;border-radius:50%;mix-blend-mode:screen;background:radial-gradient(ellipse,rgba(225,200,255,.9) 0%,rgba(150,90,230,.5) 38%,transparent 70%);transform:translate(var(--gx),var(--gy));animation:eyeglow 3.4s ease-in-out infinite}
@keyframes eyeglow{50%{filter:brightness(1.5)}}
.bust .eye-g.L{opacity:calc(.7 - var(--blinkL) * .7)}.bust .eye-g.R{opacity:calc(.7 - var(--blinkR) * .7)}
.aria-stage[data-state=speaking] .bust .eye-g{animation:eyeglow .55s ease-in-out infinite}
.bust .lid{filter:brightness(.9);-webkit-mask-image:linear-gradient(180deg,#000 75%,transparent);mask-image:linear-gradient(180deg,#000 75%,transparent)}
.bust .lid.L{clip-path:inset(0 0 calc((1 - var(--blinkL)) * 100%) 0)}.bust .lid.R{clip-path:inset(0 0 calc((1 - var(--blinkR)) * 100%) 0)}
.bust .brow{-webkit-mask-image:radial-gradient(ellipse 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50%,#000 55%,transparent 100%)}
.bust .brow.L{transform:translateY(calc(var(--brow) * -5px)) rotate(calc(var(--brow) * -2deg))}.bust .brow.R{transform:translateY(calc(var(--brow) * -5px)) rotate(calc(var(--brow) * 2deg))}
.bust .m-gap{left:297px;top:510px;width:calc(64px + var(--wide) * 26px - var(--round) * 18px);height:calc(var(--open) * 20px);transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#2a1830 0%,#0b0a0e 55%);box-shadow:0 0 4px 2px rgba(10,10,14,.55)}
.bust .m-gap .teeth{position:absolute;left:18%;right:18%;top:0;height:28%;border-radius:0 0 40% 40%;background:linear-gradient(180deg,#eeeaf0,#bdb8c4);opacity:calc((var(--open) - .35) * 1.6)}
.bust .m-low{transform:translateY(calc(var(--open) * 10px)) scaleX(calc(1 + var(--wide) * .07 - var(--round) * .1));transform-origin:50% 0;-webkit-mask-image:radial-gradient(ellipse 50% 62% at 50% 30%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 50% 62% at 50% 30%,#000 62%,transparent 100%)}
.bust .m-up{transform:translateY(calc(var(--open) * -2.2px)) scaleX(calc(1 + var(--wide) * .05 - var(--round) * .08));transform-origin:50% 100%;-webkit-mask-image:radial-gradient(ellipse 50% 70% at 50% 75%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 50% 70% at 50% 75%,#000 55%,transparent 100%)}
.bust .core-g{left:300px;top:700px;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;mix-blend-mode:screen;background:radial-gradient(circle,rgba(235,215,255,.95) 0%,rgba(150,90,230,.5) 30%,transparent 68%);opacity:calc(.35 + var(--amp) * .65);transform:scale(calc(.8 + var(--amp) * .5))}
.viz{position:absolute;left:50%;transform:translateX(-50%);bottom:86px;display:flex;gap:3px;align-items:flex-end;height:26px}
.viz i{width:3px;height:26px;border-radius:2px;background:linear-gradient(var(--gold),var(--vio));transform:scaleY(.12);transform-origin:center bottom;transition:transform .1s}
.aria-card{position:relative;z-index:2;margin-top:-80px;border-radius:22px;background:linear-gradient(160deg,rgba(42,27,64,.96),rgba(28,20,48,.98));border:1px solid rgba(var(--glow),.45);box-shadow:0 30px 70px -20px rgba(28,20,48,.55),0 0 50px rgba(var(--glow),.2);overflow:hidden;color:#fff}
.aria-top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 0}
.aria-name{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:600;letter-spacing:.18em;color:#fff;line-height:1}
.aria-role{font-size:13px;color:#cdbfe0;margin-top:4px}
.aria-status-wrap{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;color:var(--gold2);text-transform:uppercase}
.aria-status-wrap .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.aria-body{padding:12px 20px 18px;display:flex;flex-direction:column;gap:11px}
.say{min-height:62px;font-size:14px;line-height:1.5;padding:11px 13px;border-radius:14px;border-top-left-radius:4px;background:rgba(var(--glow),.14);border:1px solid rgba(var(--glow),.3);color:#f1e9f7}
.guide{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:500;letter-spacing:.03em;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--deep);box-shadow:0 0 24px rgba(var(--glow),.35)}
.guide.on{background:rgba(var(--glow),.1);border:1px dashed rgba(var(--glow),.8);color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{font-size:12.5px;padding:7px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#e3d8ee;transition:.15s}
.chips button:hover,.chips button.on{border-color:var(--gold2);color:#fff;background:rgba(var(--glow),.18)}
.mute{font-size:12px;color:#cdbfe0}
/* barra flotante de Aurora (subtítulos) */
.dock{position:fixed;left:50%;bottom:16px;transform:translate(-50%,160%);z-index:50;width:min(720px,calc(100% - 24px));display:flex;align-items:center;gap:14px;padding:10px 12px 10px 10px;border-radius:18px;background:rgba(28,20,48,.95);border:1px solid rgba(var(--glow),.45);box-shadow:0 18px 50px rgba(0,0,0,.4),0 0 30px rgba(var(--glow),.2);backdrop-filter:blur(12px);transition:transform .35s;color:#fff}
.dock.show{transform:translate(-50%,0)}
.face{background-image:var(--aurora);width:52px;height:52px;flex:none;border-radius:50%;background-size:130px auto;background-position:-39px -48px;background-color:#e4d3ef;border:1.5px solid var(--gold2);box-shadow:0 0 14px rgba(var(--glow),.5)}
.dock.talk .face{animation:fpulse 1s ease-in-out infinite}
@keyframes fpulse{50%{box-shadow:0 0 24px rgba(var(--glow),.9)}}
.dock .tx{flex:1;min-width:0;font-size:14px;line-height:1.4;color:#efe6f6;max-height:60px;overflow:hidden}
.dock .tx small{display:block;font-size:10px;letter-spacing:.25em;color:var(--gold2);margin-bottom:2px}
.dock button{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff}
.steps .ring{box-shadow:none;background:var(--mist);margin:4px 4px 10px;padding:6px 14px 6px 6px}
.steps .ring svg{width:44px;height:44px}
.head{grid-template-columns:1fr}
.app{grid-template-columns:260px 1fr 330px}
.side .aria-wrap{max-width:none}
.spot{transition:box-shadow .4s}.spot.lit{box-shadow:0 0 0 3px var(--lav),0 16px 40px -30px rgba(74,44,99,.55)}

/* app grid */
.app{display:grid;grid-template-columns:270px 1fr 300px;gap:16px}
.card{background:#fff;border-radius:var(--r);box-shadow:0 16px 40px -30px rgba(74,44,99,.55)}
.steps{padding:10px;align-self:start;position:sticky;top:76px}
.steps h4{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--soft);font-weight:600;padding:8px 12px 4px}
.steps button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 12px;border-radius:16px;transition:.2s;position:relative}
.steps button:hover{background:var(--mist)}
.steps button.on{background:var(--deep);color:#fff}
.steps button.say:after{content:"";position:absolute;right:12px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--lav);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.steps .b{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--lav2);color:var(--plum);font-weight:600;font-size:15px}
.steps button.on .b{background:var(--lav);color:var(--deep)}
.steps button.ok .b{background:#d7efe1;color:#2f7a4f}
.steps small{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.7}
.steps .t{font-size:14.5px;font-weight:400;line-height:1.25;display:block}
.viewer{padding:14px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.thumbs [data-th]{border-radius:12px;outline:2px solid transparent;outline-offset:2px;transition:.2s;cursor:pointer}
.thumbs [data-th].on{outline-color:var(--vio)}
.body{padding:6px 6px 0}
.body .wk{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--vio);font-weight:600;margin-top:14px}
.body h3{font-size:30px;color:var(--deep);line-height:1.1;margin:4px 0 8px}
.body p{color:var(--soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.box{background:var(--mist);border-radius:14px;padding:12px 14px}
.box h5{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--plum);font-weight:600;margin-bottom:4px}
.box li{list-style:none;font-size:14px;padding-left:14px;position:relative;margin:3px 0}
.box li:before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--vio)}
.navs{display:flex;justify-content:space-between;margin-top:16px;gap:10px}
.navs button{padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500;background:var(--mist);color:var(--plum)}
.navs button.pri{background:var(--deep);color:#fff}
.navs button:disabled{opacity:.35;cursor:default}

/* media slot */
.slot{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#d9c3ea,#f3e9f9 55%,#cbb0e0);isolation:isolate}
.slot:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 25%,rgba(255,255,255,.75),transparent 45%),radial-gradient(circle at 20% 85%,rgba(123,82,160,.35),transparent 50%);z-index:-1}
.slot.vid{background:linear-gradient(135deg,#3a2552,#6b4690 60%,#2a1b3d)}
.slot.vid:before{background:radial-gradient(circle at 70% 30%,rgba(201,160,220,.45),transparent 50%)}
.slot.main{aspect-ratio:16/10;border-radius:18px}
.slot.mini{aspect-ratio:1;border-radius:12px}
.slot .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:12px;color:var(--plum)}
.slot.vid .ph{color:#efe4f7}
.slot .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.65)}
.slot.vid .ic{background:rgba(255,255,255,.15)}
.slot .ic svg{width:22px;height:22px}
.slot.mini .ic{width:30px;height:30px}.slot.mini .ic svg{width:15px;height:15px}
.slot .cap{font-size:13px;font-weight:500}
.slot .add{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.75);color:var(--plum);font-weight:500}
.slot.vid .add{background:rgba(255,255,255,.18);color:#fff}
.slot img,.slot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .swap{position:absolute;right:10px;bottom:10px;font-size:11px;padding:5px 10px;border-radius:999px;background:rgba(28,20,48,.7);color:#fff;letter-spacing:1px;text-transform:uppercase}
.slot .kind{position:absolute;left:10px;top:10px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.7);color:var(--plum);font-weight:500;z-index:2}
.slot.vid .kind{background:rgba(255,255,255,.18);color:#fff}
.slot.mini .cap,.slot.mini .add,.slot.mini .kind,.slot.mini .swap{display:none}

/* side */
.side{display:flex;flex-direction:column;gap:16px}
.check{padding:20px}
.check h4,.ba-c h4{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--plum);font-weight:600;margin-bottom:8px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--mist);font-size:14.5px;cursor:pointer;line-height:1.45}
.check input{appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:none;border-radius:6px;border:2px solid var(--lav);margin-top:1px;display:grid;place-items:center;cursor:pointer;transition:.2s}
.check input:checked{background:var(--vio);border-color:var(--vio)}
.check input:checked:after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:checked+span{color:var(--soft);text-decoration:line-through}
.ba-c{padding:20px}
.ba{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;user-select:none;touch-action:none}
.ba .slot{position:absolute;inset:0;border-radius:0}
.ba .after{background:linear-gradient(135deg,#fde9f3,#fff7fb 55%,#f1dcef)}
.ba .slot .add,.ba .slot .cap{display:none}
.ba .handle{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;transform:translateX(-1px);pointer-events:none;z-index:3}
.ba .handle:after{content:"⟷";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:#fff;color:var(--plum);display:grid;place-items:center;font-size:16px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;z-index:4;margin:0}
.ba .tg{position:absolute;bottom:10px;z-index:2;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:rgba(28,20,48,.65);color:#fff}
.ba-up{display:flex;gap:8px;margin-top:10px}
.ba-up button{flex:1;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:8px;border-radius:10px;background:var(--mist);color:var(--plum);font-weight:500}
.buy{padding:22px;background:var(--deep);color:#fff;text-align:center}
.buy .price{font-family:"Cormorant Garamond",serif;font-size:50px;line-height:1;margin-top:4px}
.buy .price small{font-size:16px;color:#cdb3dd}
.buy p{font-size:13px;color:#cdbfe0;margin:6px 0 14px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:14px;border-radius:999px;font-weight:500;text-decoration:none;background:var(--lav);color:var(--deep);transition:.2s}
.btn:hover{background:#d4b6e6}
.inc{margin-top:16px;padding:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inc h4{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--plum);font-weight:600;margin-right:6px}
.inc span{font-size:14px;padding:7px 14px;border-radius:999px;background:linear-gradient(135deg,var(--lav2),#f6e7f1);color:var(--plum)}
.foot{text-align:center;font-size:13px;color:var(--soft);padding-top:28px}
.foot span{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--vio);margin-top:6px}

body.live .slot .add,body.live .slot .swap,body.live .ba-up{display:none!important}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .steps{position:static;display:flex;overflow-x:auto;gap:6px;scrollbar-width:none}
  .steps::-webkit-scrollbar{display:none}
  .steps h4{display:none}
  .steps button{flex:0 0 auto;width:auto;max-width:230px}
}
@media (max-width:640px){
  .head{grid-template-columns:1fr}
  .brand{align-items:flex-start}
  .brand img{width:76px}
  .ring{justify-self:start}
  .aurora{grid-template-columns:auto 1fr;padding:14px}
  .au-btns{grid-column:1/3}
  .au-btns button{flex:1;justify-content:center}
  .av{width:64px;height:64px}
  .two{grid-template-columns:1fr}
  .bar .lbl{display:none}
  .aria-wrap{margin:0 auto}
}
@media (max-width:980px){.side{display:contents}.side .aria-wrap{order:-1;max-width:420px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  $("#baCard").style.display=S[svc].ba?"":"none";
  $("#ba").innerHTML=`${slot(key("ba-before"),"photo",u.before,"")}<div class="after-w">${slot(key("ba-after"),"photo",u.after,"after")}</div><span class="tg" style="left:10px">${u.before}</span><span class="tg" style="right:10px">${u.after}</span><div class="handle" id="baH"></div><input type="range" min="0" max="100" value="${baV}" id="baR" aria-label="${u.ba}">`;
  $$(".ba-up button").forEach((b,i)=>b.dataset.pick=key(i?"ba-after":"ba-before"));
  setBA(baV);
  $("#price").innerHTML=`${LIVE&&DATA.price?DATA.price:"US$ "+S[svc].price} <small>${u.tax}</small>`;
  const bot=(LIVE&&DATA.bot_whatsapp)||"15551794750";
  if(LIVE&&DATA.appointment){
    const d=new Date(DATA.appointment.start);
    const when=new Intl.DateTimeFormat(L==="en"?"en-US":"es-CO",{timeZone:DATA.appointment.tz||"America/New_York",weekday:"long",month:"long",day:"numeric",hour:"numeric",minute:"2-digit"}).format(d);
    $("#book").textContent=(L==="en"?"Change my appointment":"Cambiar mi cita")+" →";
    $("#book").href=`https://wa.me/${bot}?text=`+encodeURIComponent(L==="en"?"Hi! I'd like to change my appointment.":"¡Hola! Quiero cambiar mi cita.");
    $(".buy p").textContent=(L==="en"?"📅 Your appointment: ":"📅 Tu cita: ")+when;
  } else {
    $("#book").textContent=u.book+" →"; $("#book").href=`https://wa.me/${bot}?text=`+encodeURIComponent(u.bookMsg(s));
  }
  $("#inc").innerHTML=`<h4>${u.it}</h4>`+s.inc.map(i=>`<span>${i}</span>`).join("");
  const all=s.steps.reduce((a,o,i)=>a+o.p.length,0), ok=s.steps.reduce((a,o,i)=>a+o.p.filter((_,j)=>checks[key(`c${i}-${j}`)]).length,0);
  const pct=Math.round(ok/all*100); $("#pct").textContent=pct+"%"; $("#ringFg").style.strokeDashoffset=157-157*pct/100;
  if(typeof drawAurora==="function") drawAurora();
}
let baV=50;
function setBA(v){baV=v;const a=$("#ba .after-w");if(a){a.style.cssText=`position:absolute;inset:0;clip-path:inset(0 0 0 ${v}%)`;$("#baH").style.left=v+"%"}}

/* ===== events ===== */
let pickKey=null;
document.addEventListener("click",e=>{
  const p=e.target.closest("[data-pick]"); if(p){e.stopPropagation();pickKey=p.dataset.pick;$("#picker").value="";$("#picker").click();return}
  const t=e.target.closest("[data-svc]"); if(t){stopTour();svc=+t.dataset.svc;st=0;th=0;render();return}
  const a=e.target.closest("[data-st]"); if(a){if(running)stopTour();go(+a.dataset.st);return}
  const n=e.target.closest("[data-nav]"); if(n){go(st+ +n.dataset.nav);return}
  const h=e.target.closest("[data-th]"); if(h){th=+h.dataset.th;render();return}
},true);
document.addEventListener("change",e=>{
  if(e.target.dataset.c){checks[key(e.target.dataset.c)]=e.target.checked;render()}
});
document.addEventListener("input",e=>{if(e.target.id==="baR")setBA(e.target.value)});
$("#picker").addEventListener("change",e=>{const f=e.target.files[0];if(!f||!pickKey)return;media[pickKey]={url:URL.createObjectURL(f),type:f.type.startsWith("video")?"video":"photo"};render()});
$$(".lang button").forEach(b=>b.onclick=()=>{stopTour();L=b.dataset.l;try{localStorage.setItem("luna-lang",L)}catch(e){};pickVoice();render()});
function go(i){const n=sv().steps.length;st=Math.max(0,Math.min(n-1,i));th=0;render()}

/* ======= AURORA: rig facial (idéntico a ARIA) ======= */
function Rig(stage){
 const K=["open","wide","round","brow","blinkL","blinkR","rot","tx","ty","gx","gy","amp"],cur={},tgt={};K.forEach(k=>cur[k]=tgt[k]=0);
 const V=[[.95,.35,0],[.5,.95,0],[.65,0,1],[.04,.25,0],[.3,.55,.15],[.78,.15,.35],[.2,.8,0],[.55,.1,.7]];
 let speaking=false,until=0,nextV=0,nextBlink=performance.now()+1800,blinkEnd=0,nextS=0,emph=0,lastV=-1;const R=Math.random;
 function frame(now){const t=now/1000,talk=speaking||now<until;
  if(talk&&now>nextV){let v;do{v=Math.floor(R()*V.length)}while(v===lastV);lastV=v;const close=R()<.14;tgt.open=close?.02:V[v][0]*(.75+R()*.35);tgt.wide=V[v][1];tgt.round=V[v][2];nextV=now+85+R()*120;if(R()<.12)emph=Math.min(1,emph+.6)}
  if(!talk){tgt.open=0;tgt.wide=0;tgt.round=0}emph*=.94;
  tgt.rot=Math.sin(t*.55)*.7+(talk?Math.sin(t*2.1)*1.3+Math.sin(t*3.7)*.5:0)-emph*1.2;
  tgt.tx=Math.sin(t*.37)*2.5+(talk?Math.sin(t*1.7)*1.5:0);tgt.ty=Math.sin(t*.8)*1.6+(talk?Math.sin(t*4.3)*1.1:0)+emph*4;
  tgt.brow=talk?.12+emph*.9+Math.max(0,Math.sin(t*1.3))*.25:Math.max(0,Math.sin(t*.25)-.85)*2;
  if(now>nextS){tgt.gx=(R()-.5)*(talk?3:5);tgt.gy=(R()-.5)*2;nextS=now+700+R()*2400}
  if(now>nextBlink){tgt.blinkL=tgt.blinkR=1;blinkEnd=now+95;nextBlink=now+(R()<.18?260:2200+R()*4200)}
  if(blinkEnd&&now>blinkEnd){tgt.blinkL=tgt.blinkR=0;blinkEnd=0}
  tgt.amp=talk?.35+tgt.open*.6:.08+Math.sin(t*1.5)*.05;
  for(const k of K){const r=k==="open"||k==="wide"||k==="round"?.38:k.startsWith("blink")?.55:.1;cur[k]+=(tgt[k]-cur[k])*r}
  const st=stage.style;["open","wide","round","brow","blinkL","blinkR","amp"].forEach(k=>st.setProperty("--"+k,cur[k].toFixed(3)));
  st.setProperty("--rot",cur.rot.toFixed(2)+"deg");["tx","ty","gx","gy"].forEach(k=>st.setProperty("--"+k,cur[k].toFixed(2)+"px"));
  requestAnimationFrame(frame)}
 requestAnimationFrame(frame);
 return{speak(on){speaking=on;if(!on)emph=.5},accent(){emph=1},talkFor(ms){until=performance.now()+ms}};
}

/* ======= AURORA: voz (gratis: voz del navegador) ======= */
const stage=document.querySelector(".aria-stage"),rig=Rig(stage),bars=()=>document.querySelectorAll("#viz i");
$("#viz").innerHTML="<i></i>".repeat(14);
const hasTTS="speechSynthesis" in window;let voice=null,speakingStep=-1;
function pickVoice(){if(!hasTTS)return;const vs=speechSynthesis.getVoices();
 voice=L==="en"?(vs.find(v=>/en[-_]US/i.test(v.lang)&&/female|samantha|zira|jenny|aria|google us/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang))||null)
               :(vs.find(v=>/es[-_](US|MX|CO|419)/i.test(v.lang)&&/female|mujer|paulina|sabina|helena|google/i.test(v.name))||vs.find(v=>/^es/i.test(v.lang))||null)}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function setState(s){stage.dataset.state=s;$("#status").textContent=s==="speaking"?ui().talking:ui().online;$("#dock").classList.toggle("talk",s==="speaking")}
function show(text){$("#say").textContent=text;$("#dockTx").textContent=text}
let vizT=null,token=0;
function speak(text){
 const my=token;show(text);
 const parts=text.match(/[^.!?]+[.!?]*/g)||[text];
 return new Promise(res=>{
  if(!hasTTS){setState("speaking");rig.talkFor(Math.min(9000,text.length*40));setTimeout(()=>{setState("idle");res()},Math.max(2500,text.length*40));return}
  let i=0;
  const next=()=>{
   if(my!==token)return res();
   if(i>=parts.length){clearInterval(vizT);rig.speak(false);bars().forEach(b=>b.style.transform="");setState("idle");return res()}
   const u=new SpeechSynthesisUtterance(parts[i++].trim());u.lang=L==="en"?"en-US":"es-US";if(voice)u.voice=voice;u.rate=L==="en"?1.15:1.3;u.pitch=1.05;
   let done=false,started=false;const fin=()=>{if(done)return;done=true;clearTimeout(safe);if(!started){setState("speaking");rig.talkFor(u.text.length*40);setTimeout(()=>{setState("idle");next()},Math.max(1500,u.text.length*40))}else next()};
   const safe=setTimeout(fin,u.text.length*110+2500);
   u.onstart=()=>{started=true;setState("speaking");rig.speak(true);clearInterval(vizT);vizT=setInterval(()=>bars().forEach(b=>b.style.transform=`scaleY(${.15+Math.random()})`),95)};
   u.onboundary=()=>{if(Math.random()<.35)rig.accent()};
   u.onend=u.onerror=fin;speechSynthesis.speak(u)};
  speechSynthesis.cancel();setTimeout(next,60);
 })}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function light(k){$$(".spot").forEach(x=>x.classList.toggle("lit",!!k&&(x.dataset.spot===k||(k==="steps"&&x.dataset.spot==="steps2"))))}
function goSpot(k){const el=document.querySelector(`[data-spot="${k}"]`);if(el)el.scrollIntoView({behavior:"smooth",block:"center"});light(k)}

function scripts(key){
 const s=sv(),u=ui(),p=S[svc].price;
 const stepsSeq=s.steps.map((x,i)=>[()=>{speakingStep=i;go(i);goSpot("steps")},u.stepTxt(s,i,x)]);
 const intro=[()=>{window.scrollTo({top:0,behavior:"smooth"});light(null)},u.intro(s)];
 const inv=[()=>{speakingStep=-1;render();goSpot("buy")},u.inv(s,p)];
 const emp=[()=>goSpot("buy"),u.emp];
 return {full:[intro,...stepsSeq,inv,emp],leer:[[()=>goSpot("steps"),u.leer]],pasos:stepsSeq,tu:[[()=>goSpot("check"),u.tu(s)]],inversion:[inv],empezar:[emp]}[key];
}
let running=false;
async function run(key,btn){
 stopTour();const my=++token;running=true;
 $$(".chips button").forEach(b=>b.classList.toggle("on",b===btn));
 $("#guide").classList.add("on");$("#guide").textContent=ui().guideStop;$("#dock").classList.toggle("show",!auroraVisible);
 for(const [act,text] of scripts(key)){if(my!==token)return;act();await wait(450);if(my!==token)return;await speak(text);await wait(350)}
 if(my===token)endTour(false);
}
function endTour(clear){running=false;speakingStep=-1;$("#guide").classList.remove("on");$("#guide").textContent=ui().guideGo;$$(".chips button").forEach(b=>b.classList.remove("on"));if(clear)light(null);render()}
function stopTour(){token++;if(hasTTS)speechSynthesis.cancel();clearInterval(vizT);rig.speak(false);setState("idle");if(running)endTour(true)}
function drawAurora(){
 const u=ui();
 $("#chips").innerHTML=u.chips.map(([k,t])=>`<button data-k="${k}">${t}</button>`).join("");
 $$("#chips button").forEach(b=>b.onclick=()=>run(b.dataset.k,b));
 if(!running){$("#guide").textContent=u.guideGo;show(u.hello(sv()));setState("idle")}
 $("#noVoice").hidden=hasTTS;
}
$("#guide").onclick=()=>running?stopTour():run("full");
$("#dockPlay").onclick=()=>run("full");$("#dockStop").onclick=stopTour;
let auroraVisible=true;
new IntersectionObserver(([e])=>{auroraVisible=e.isIntersecting;$("#dock").classList.toggle("show",!e.isIntersecting)},{threshold:.2}).observe($("#aria"));
if(LIVE){ document.body.classList.add("live"); $("#svcs").style.display="none"; const lb=$(".bar .lbl"); if(lb) lb.style.display="none"; $(".bar .in").style.justifyContent="flex-end"; $("#cliName").textContent=DATA.client_name||""; if(!DATA.client_name) $("#cliName").parentElement.style.display="none"; $$(".foot span").forEach(x=>x.style.display="none"); }
render();
</script>
