name: tts
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts && python tools/tts_segments.py && ls -la media/vo/tts
      - run: |
          git config user.name "wia-bot"; git config user.email "bot@users.noreply.github.com"
          git add media/vo/tts && git commit -m "tts segments" && git pull --rebase && git push
